name: Public Dashboard Health Watchdog

# Independent, credential-free check of exactly what a visitor receives through
# CloudFront. The Lambda watchdog owns S3/SNS checks; this workflow catches a
# disabled schedule, stale CDN/public artifact, or Lambda-wide outage from outside.

on:
  schedule:
    - cron: '35 8 * * *'        # 08:35 UTC nightly — just after the night pipeline + canaries
    - cron: '15 15 * * 1-5'     # 15:15 UTC weekdays — post-pipeline, after morning execution
  workflow_dispatch: {}         # manual re-run

jobs:
  public-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check public lines and operational snapshot
        run: python scripts/check_public_dashboard.py

      - name: Require today's morning snapshot
        if: github.event.schedule == '15 15 * * 1-5'
        run: python scripts/check_public_dashboard.py --require-morning
