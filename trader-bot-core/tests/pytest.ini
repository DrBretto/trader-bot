[pytest]
# Reality suite (P7) — collected from THIS directory only. The old repo-root
# tests/ 570-suite is retired as the acceptance surface; the nightly + post-
# pipeline gate targets trader-bot-core/tests/ exclusively.
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -p no:cacheprovider
markers =
    unit: Tier-1 deterministic unit-fixture (real recorded data). Every commit.
    live_canary: Tier-2 assert against TODAY's real S3/CloudWatch. Nightly + post-pipeline.
    external_check: Tier-3 call the real feed (Yahoo/GDELT) independently. Nightly.
    fault_injection: proves a canary goes RED on a deliberately broken reality.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::RuntimeWarning
